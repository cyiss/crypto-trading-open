# ============================================================================
# WEEX 网格交易配置文件
# ============================================================================
# 
# 使用方法:
#   python run_weex_grid_trading.py config/grid/weex_grid_config.yaml
#
# ============================================================================

# ----------------------------------------------------------------------------
# 交易对配置
# ----------------------------------------------------------------------------
symbol: "BTCUSDT"

# ----------------------------------------------------------------------------
# 网格参数
# ----------------------------------------------------------------------------
grid:
  # 网格类型: arithmetic (等差) 或 geometric (等比)
  type: "arithmetic"
  
  # 网格价格范围
  upper_price: 110000        # 网格上限价格
  lower_price: 80000         # 网格下限价格
  
  # 网格数量
  count: 20                  # 网格线数量
  
  # 每格利润率 (可选，自动计算)
  # profit_per_grid: 0.005   # 0.5%

# ----------------------------------------------------------------------------
# 订单配置
# ----------------------------------------------------------------------------
order:
  # 每单数量 (张)
  size: 20
  
  # 订单类型: limit (限价) 或 market (市价)
  type: "limit"
  
  # 是否使用只做Maker (Post-Only)
  post_only: false

# ----------------------------------------------------------------------------
# 杠杆配置
# ----------------------------------------------------------------------------
leverage:
  # 杠杆倍数
  multiplier: 20
  
  # 保证金模式: cross (全仓) 或 isolated (逐仓)
  margin_mode: "cross"

# ----------------------------------------------------------------------------
# 资金管理
# ----------------------------------------------------------------------------
capital:
  # 总投资额 (USDT)
  total_investment: 1000
  
  # 单边最大持仓 (张)
  max_position: 200
  
  # 保留余额 (USDT)
  reserve_balance: 100

# ----------------------------------------------------------------------------
# 风险控制
# ----------------------------------------------------------------------------
risk:
  # 止盈配置
  take_profit:
    enabled: true
    percentage: 0.05         # 5% 止盈
    
  # 止损配置
  stop_loss:
    enabled: true
    percentage: 0.10         # 10% 止损
    
  # 本金保护
  capital_protection:
    enabled: true
    threshold: 0.20          # 本金损失20%时触发保护

# ----------------------------------------------------------------------------
# 运行参数
# ----------------------------------------------------------------------------
runtime:
  # 价格检查间隔 (秒)
  price_check_interval: 1
  
  # 订单检查间隔 (秒)
  order_check_interval: 5
  
  # 持仓检查间隔 (秒)
  position_check_interval: 10
  
  # 网格重置间隔 (秒，0表示不自动重置)
  grid_reset_interval: 0

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  level: "INFO"
  
  # 是否记录所有订单
  log_orders: true
  
  # 是否记录价格变动
  log_price_changes: false

# ----------------------------------------------------------------------------
# 通知配置 (可选)
# ----------------------------------------------------------------------------
notification:
  # 是否启用通知
  enabled: false
  
  # 通知类型: telegram, discord, email
  type: "telegram"
  
  # 通知事件
  events:
    - "order_filled"
    - "take_profit"
    - "stop_loss"
    - "error"
