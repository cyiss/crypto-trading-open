# Grid Trading Configuration - DASH (S级)
# 自动生成基于扫描器数据
# 生成时间: 2026-03-14
# APR: 2966.9% | 价格: $32.69 | 循环/时: 1764

exchange: "lighter"
symbol: "DASH"
market_type: "perp"
grid_type: "follow_long"

# ===== 仓位管理 =====
order_amount: 0.306  # 10 USD / $32.69 ≈ 0.306 DASH
grid_interval: 0.33   # 1% 价格间距
follow_grid_count: 100
follow_distance: 2

# ===== 杠杆与风险 =====
leverage: 20
initial_margin: 500  # 初始保证金 $500

# ===== Scalping配置 =====
scalping_enabled: true
smart_scalping_enabled: true
scalping_trigger_percent: 80
scalping_min_profit_bps: 5

# ===== 资金保护 =====
capital_protection_enabled: true
capital_protection_trigger_percent: 25

# ===== 止盈止损 =====
take_profit_enabled: true
take_profit_percent: 50

# ===== 动态参数 =====
dynamic_parameters:
  enabled: true
  update_interval: 600  # 10分钟更新一次
  atr_period: 14
  volatility_window: 20

# ===== 安全边界 =====
dynamic_fallback:
  grid_interval_min: 0.16
  grid_interval_max: 0.82
  order_amount_min: 0.15
  order_amount_max: 0.61
  follow_grid_count_min: 50
  follow_grid_count_max: 150

# ===== 退出清理 =====
exit_cleanup_enabled: true
