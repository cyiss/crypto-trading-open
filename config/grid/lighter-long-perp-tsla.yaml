# Grid Trading Configuration - TSLA (S级)
# 自动生成基于扫描器数据
# 生成时间: 2026-03-14
# APR: 3612.8% | 价格: $393.35 | 循环/时: 2148

grid_system:
  # ============================================================================
  # 基础配置
  # ============================================================================
  exchange: "lighter"
  symbol: "TSLA"
  grid_type: "follow_long"

  # ============================================================================
  # 价格移动网格参数
  # ============================================================================
  follow_grid_count: 100          # 网格数量
  follow_timeout: 1000000000000    # 脱离超时
  follow_distance: 2               # 脱离距离
  price_offset_grids: 0          # 价格偏移

  # ============================================================================
  # 通用网格参数 - 基于10u单次仓位
  # ============================================================================
  grid_interval: 3.93             # 网格间距 ($3.93 ≈ 1%)
  order_amount: 0.0254            # 每格数量 (10 USD / $393.35)
  quantity_precision: 4           # 数量精度
  price_decimals: 2               # 价格精度
  margin_mode: "cross"            # 保证金模式
  leverage: 20                    # 杠杆倍数

  # ============================================================================
  # 🔥 剥头皮模式
  # ============================================================================
  scalping_enabled: true
  scalping_trigger_percent: 55    # 持仓达到55%触发减仓
  scalping_take_profit_grids: 10  # 平仓10格

  smart_scalping_enabled: true
  allowed_deep_drops: 1
  min_drop_threshold_percent: 15

  # ============================================================================
  # 🛡️ 本金保护模式
  # ============================================================================
  capital_protection_enabled: true
  capital_protection_trigger_percent: 25  # 价格跌破25%触发止损
  capital_protection_cooldown: 300

  # ============================================================================
  # 💰 止盈模式
  # ============================================================================
  take_profit_enabled: true
  take_profit_percent: 50         # 总盈利50%止盈
  take_profit_cooldown: 600

  # ============================================================================
  # 🔧 动态参数调整
  # ============================================================================
  dynamic_parameters:
    enabled: true
    update_interval: 600          # 10分钟更新
    atr_period: 14
    volatility_window: 20

  # ============================================================================
  # 🚨 退出清理
  # ============================================================================
  exit_cleanup_enabled: true      # 程序退出时自动平仓

  # ============================================================================
  # 📊 绩效追踪
  # ============================================================================
  performance_tracking_enabled: true
  ml_tracking_enabled: true
