# WEEX 统一交易系统配置文件
# 
# 使用方法:
#   python examples/weex_trading_server.py config/weex/trading_config.yaml

# ============================================================================
# 1. 网格交易系统配置
# ============================================================================
grid_trading:
  enabled: true                    # 是否启用
  symbol: "BTCUSDT"               # 交易对
  grid_type: "normal"             # 网格类型: normal/follow_long/follow_short
  lower_price: 85000              # 价格下限
  upper_price: 95000              # 价格上限
  grid_count: 10                  # 网格数量
  order_amount: 20                # 每格下单数量（张）
  leverage: 20                    # 杠杆倍数
  
  # 高级配置
  follow_grid_count: 5            # 跟随网格数量（仅follow模式）
  follow_timeout: 300             # 跟随超时时间（秒）
  price_offset_grids: 0           # 价格偏移网格数

# ============================================================================
# 2. 刷量交易系统配置
# ============================================================================
volume_maker:
  enabled: false                  # 是否启用
  symbol: "BTCUSDT"               # 交易对
  order_size: 20                  # 单笔订单大小（张）
  interval: 10                    # 交易间隔（秒）
  spread_tolerance: 0.001         # 价差容忍度（0.1%）
  daily_target: 1000000           # 日目标交易量（USDT）
  
  # 高级配置
  max_pending_orders: 2           # 最大挂单数
  cancel_timeout: 3               # 撤单超时（秒）

# ============================================================================
# 3. 套利监控与执行系统配置
# ============================================================================
arbitrage:
  enabled: false                  # 是否启用
  symbol: "BTCUSDT"               # 交易对
  min_spread: 0.005               # 最小价差阈值（0.5%）
  order_size: 20                  # 套利单大小（张）
  auto_execute: false             # 是否自动执行
  
  # 参考交易所配置（需要外部数据源）
  reference_exchanges:
    - name: "binance"
      enabled: true
    - name: "okx"
      enabled: false

# ============================================================================
# 4. 网格波动率扫描器配置
# ============================================================================
volatility_scanner:
  enabled: false                  # 是否启用
  symbols:                        # 扫描的交易对列表
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
    - "XRPUSDT"
  scan_interval: 300              # 扫描间隔（秒）
  min_volatility: 0.01            # 最小波动率阈值（1%）
  max_volatility: 0.10            # 最大波动率阈值（10%）
  
  # 推荐条件
  min_volume_24h: 10000000        # 最小24小时交易量（USDT）

# ============================================================================
# 5. 价格提醒系统配置
# ============================================================================
price_alert:
  enabled: true                   # 是否启用
  symbol: "BTCUSDT"               # 交易对
  upper_limit: 100000             # 价格上限
  lower_limit: 80000              # 价格下限
  change_threshold: 0.02          # 变动阈值（2%）
  check_interval: 5               # 检查间隔（秒）
  
  # 提醒方式
  alert_methods:
    - console                     # 控制台输出
    - sound                       # 声音提醒（需要系统支持）

# ============================================================================
# WebSocket 服务器配置
# ============================================================================
websocket:
  host: "0.0.0.0"
  port: 8766
  timeout: 10                     # 命令超时时间（秒）

# ============================================================================
# 日志配置
# ============================================================================
logging:
  level: "INFO"                   # 日志级别: DEBUG/INFO/WARNING/ERROR
  file: "logs/weex_trading.log"   # 日志文件路径
  max_size: 10485760              # 最大文件大小（10MB）
  backup_count: 5                 # 备份文件数量
